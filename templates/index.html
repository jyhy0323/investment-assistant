<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Data Collector &amp; Briefing Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Stock Data Collector &amp; Briefing Tool</h1>
      <p class="subtitle">종목코드 6자리를 입력하면 네이버 금융 데이터와 최신 뉴스를 한눈에 수집합니다.</p>
    </header>

    <!-- 1. 검색창 구역 -->
    <section class="search-section">
      <form id="search-form" class="search-form">
        <input
          type="text"
          id="stock-code"
          name="code"
          maxlength="6"
          placeholder="종목코드 6자리 입력 (예: 000660)"
          autocomplete="off"
        />
        <button type="submit" id="fetch-btn">데이터 수집</button>
      </form>
      <div class="quick-examples">
        <span>빠른 입력:</span>
        <button type="button" class="example-btn" data-code="000660">SK하이닉스 (000660)</button>
        <button type="button" class="example-btn" data-code="005930">삼성전자 (005930)</button>
        <button type="button" class="example-btn" data-code="035420">NAVER (035420)</button>
      </div>
    </section>

    <!-- 로딩 & 오류 메시지 구역 -->
    <div id="status-message" class="status-message hidden"></div>
    <div id="error-box" class="error-box hidden"></div>

    <!-- 결과 표시 영역 (수집 완료 후 표시) -->
    <main id="result-area" class="result-area hidden">
      <!-- 2. 스냅샷 카드 구역 -->
      <section class="card">
        <div class="stock-header">
          <div>
            <h2 id="stock-name">-</h2>
            <span id="stock-code-badge" class="badge">-</span>
          </div>
          <div class="price-box">
            <span id="current-price" class="current-price">-</span>
            <span id="change-rate" class="change-rate">-</span>
          </div>
        </div>

        <div class="snapshot-grid">
          <div class="metric-item">
            <span class="metric-label">시가총액</span>
            <strong id="market-cap" class="metric-value">-</strong>
          </div>
          <div class="metric-item">
            <span class="metric-label">PER (주가수익비율)</span>
            <strong id="per-value" class="metric-value">-</strong>
          </div>
          <div class="metric-item">
            <span class="metric-label">PBR (주가순자산비율)</span>
            <strong id="pbr-value" class="metric-value">-</strong>
          </div>
        </div>
      </section>

      <!-- 3. 기업실적분석 표 구역 -->
      <section class="card">
        <div class="section-title-row">
          <h2>기업실적분석 (연간)</h2>
          <span class="legend-note">※ <strong>(E) 추정치</strong>는 확정 실적이 아닌 증권가 예상치입니다.</span>
        </div>
        <div class="table-wrapper">
          <table class="financials-table">
            <thead>
              <tr>
                <th>기간</th>
                <th>구분</th>
                <th>매출액</th>
                <th>영업이익</th>
                <th>ROE (%)</th>
              </tr>
            </thead>
            <tbody id="financials-body"></tbody>
          </table>
        </div>
      </section>

      <!-- 4. 최신 뉴스 리스트 구역 -->
      <section class="card">
        <h2>최신 관련 뉴스 (Serper)</h2>
        <ul id="news-list" class="news-list"></ul>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
